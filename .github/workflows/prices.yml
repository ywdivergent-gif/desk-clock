name: Update prices

on:
  schedule:
    - cron: "*/20 13-21 * * 1-5"  # starts the every-minute loop during US market hours (UTC)
    - cron: "17 */3 * * *"        # one refresh every 3 hours otherwise
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tickers.json"]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices (every minute while the market is open)
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          python3 scripts/fetch_prices.py --loop
